{% extends 'base.html' %}

{% block title %}Add Technology Resource | TechSphere Club{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1rem auto 4rem auto;">
    <div style="margin-bottom: 1.5rem;">
        <a href="{{ url_for('tech_hub') }}" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Cancel & Back to Tech Hub
        </a>
    </div>

    <div class="card" style="padding: 2.25rem;">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">
            <i class="fa-solid fa-folder-plus" style="color: var(--cyan);"></i> Add Tech Hub Resource
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
            Share roadmaps, developer tools, project ideas, or interview prep guides.
        </p>

        <form method="POST">
            <div class="form-group">
                <label for="title" class="form-label">Resource Title *</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g. AI & Machine Learning Engineer Career Roadmap" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="category" class="form-label">Category *</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="Roadmaps">Roadmaps</option>
                        <option value="Tools">Tools</option>
                        <option value="Technologies">Technologies</option>
                        <option value="Project Ideas">Project Ideas</option>
                        <option value="Interview Preparation">Interview Preparation</option>
                        <option value="Git/GitHub">Git/GitHub</option>
                        <option value="Programming">Programming</option>
                        <option value="AI">AI / Machine Learning</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Database">Database</option>
                        <option value="Cloud">Cloud</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="technology" class="form-label">Primary Technology *</label>
                    <input type="text" id="technology" name="technology" class="form-control" placeholder="e.g. AI / Python / Git" required>
                </div>
            </div>

            <div class="form-group">
                <label for="external_link" class="form-label">Verified External Link (URL) *</label>
                <input type="url" id="external_link" name="external_link" class="form-control" placeholder="https://roadmap.sh/ai-data-scientist" required>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Detailed Description *</label>
                <textarea id="description" name="description" class="form-control" rows="3" placeholder="Summary of what students will learn from this resource..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                <i class="fa-solid fa-plus"></i> Publish Tech Resource
            </button>
        </form>
    </div>
</div>
{% endblock %}
