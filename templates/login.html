{% extends 'base.html' %}

{% block title %}Sign In | TechSphere Club{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto 4rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="width: 54px; height: 54px; margin: 0 auto 1rem auto; font-size: 1.5rem;">
                <i class="fa-solid fa-atom"></i>
            </div>
            <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Sign in to your TechSphere Club account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user search-icon"></i>
                    <input type="text" id="username" name="username" class="form-control" style="padding-left: 2.4rem;" placeholder="e.g. hod_cse or student@techsphere.edu" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock search-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" style="padding-left: 2.4rem;" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <!-- Demo Accounts Quick Fill (Client Sales Feature) -->
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle);">
            <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.85rem; text-align: center;">
                <i class="fa-solid fa-shield-halved" style="color: var(--cyan);"></i> Instant Demo Login Presets
            </p>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <button type="button" onclick="fillLogin('hod@techsphere.edu', 'password123')" class="btn btn-outline btn-sm" style="justify-content: space-between;">
                    <span><i class="fa-solid fa-user-shield" style="color: #c084fc;"></i> HOD Account</span>
                    <span class="user-role-pill role-hod">HOD</span>
                </button>
                <button type="button" onclick="fillLogin('faculty@techsphere.edu', 'password123')" class="btn btn-outline btn-sm" style="justify-content: space-between;">
                    <span><i class="fa-solid fa-chalkboard-user" style="color: #38bdf8;"></i> Faculty Account</span>
                    <span class="user-role-pill role-faculty">Faculty</span>
                </button>
                <button type="button" onclick="fillLogin('coordinator@techsphere.edu', 'password123')" class="btn btn-outline btn-sm" style="justify-content: space-between;">
                    <span><i class="fa-solid fa-user-gear" style="color: #34d399;"></i> Club Coordinator</span>
                    <span class="user-role-pill role-coordinator">Coordinator</span>
                </button>
                <button type="button" onclick="fillLogin('eventmanager@techsphere.edu', 'password123')" class="btn btn-outline btn-sm" style="justify-content: space-between;">
                    <span><i class="fa-solid fa-calendar-plus" style="color: #fbbf24;"></i> Event Manager</span>
                    <span class="user-role-pill role-event-manager">Event Manager</span>
                </button>
                <button type="button" onclick="fillLogin('student@techsphere.edu', 'password123')" class="btn btn-outline btn-sm" style="justify-content: space-between;">
                    <span><i class="fa-solid fa-user-graduate" style="color: #a5b4fc;"></i> Student Account</span>
                    <span class="user-role-pill role-student">Student</span>
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have a student account? <a href="{{ url_for('register') }}">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillLogin(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
