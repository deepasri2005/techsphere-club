{% extends 'base.html' %}

{% block title %}404 Page Not Found | TechSphere Club{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem; max-width: 550px; margin: 0 auto;">
    <div style="font-size: 5rem; color: var(--cyan); margin-bottom: 1rem;">
        <i class="fa-solid fa-compass-drafting"></i>
    </div>
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">404 - Page Not Found</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
        The portal route or resource you are trying to reach does not exist or may have been moved.
    </p>
    <div style="display: flex; justify-content: center; gap: 1rem;">
        <a href="{{ url_for('index') }}" class="btn btn-outline">
            <i class="fa-solid fa-house"></i> Return to Home
        </a>
        <a href="{{ url_for('events') }}" class="btn btn-cyan">
            <i class="fa-solid fa-calendar-days"></i> Browse Events
        </a>
    </div>
</div>
{% endblock %}
