{% extends 'base.html' %}

{% block title %}Register Student Account | TechSphere Club{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto 4rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="width: 54px; height: 54px; margin: 0 auto 1rem auto; font-size: 1.5rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Join TechSphere Community</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Create your student account to register for events & courses</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Ananya Sen" required>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. ananya_s" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">College Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@techsphere.edu" required>
            </div>

            <div class="form-group">
                <label for="department" class="form-label">Academic Department</label>
                <select id="department" name="department" class="form-select" required>
                    <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                    <option value="Electronics & Communication">Electronics & Communication</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-cyan" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                <i class="fa-solid fa-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
